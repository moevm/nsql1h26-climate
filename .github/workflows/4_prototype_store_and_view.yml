name: "4. Прототип хранение и представление"

on:
  push:
    branches:
      - main

jobs:
  check_prototype_store_and_view:
    name: "Проверка наличия тега 0.5, работоспособности docker compose и наличия сервиса db"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: Check out current commit
        with:
          fetch-depth: 0

      - name: Check docker-compose.yml
        run: .github/workflows/scripts/4_prototype_store_and_view.sh check-compose ./leti_climate_prototipe/docker-compose.yml

      - name: Build docker-compose
        run: docker compose -f ./leti_climate_prototipe/docker-compose.yml build --no-cache

      - name: Run docker-compose
        run: docker compose -f ./leti_climate_prototipe/docker-compose.yml up -d

      - name: check
        run: .github/workflows/scripts/4_prototype_store_and_view.sh check-tag
